<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Наші тарифи</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="pricing">
      <div class="container">
        <header class="pricing__header">
          <h2>Наші тарифи</h2>
          <p>Оберіть план, який найкраще підходить для ваших завдань</p>
        </header>

        <div class="pricing__grid">
          <article class="pricing-card">
            <h3 class="pricing-card__title">Basic</h3>
            <div class="pricing-card__price">
              <span class="price-value">$10</span><span class="price-period"> / month</span>
            </div>
            <ul class="pricing-card__features">
              <li>1 User</li>
              <li>5GB Storage</li>
              <li>Basic Support</li>
            </ul>
            <button class="btn btn--outline">Select</button>
          </article>

          <article class="pricing-card pricing-card--featured">
            <div class="pricing-card__badge">PRO &bull; ACTIVE</div>
            <h3 class="pricing-card__title">Pro</h3>
            <div class="pricing-card__price">
              <span class="price-value">$29</span><span class="price-period"> / month</span>
            </div>
            <ul class="pricing-card__features">
              <li>5 Users</li>
              <li>50GB Storage</li>
              <li>Priority Support</li>
            </ul>
            <button class="btn btn--solid">Get Started</button>
          </article>

          <article class="pricing-card">
            <h3 class="pricing-card__title">Enterprise</h3>
            <div class="pricing-card__price">
              <span class="price-value">$99</span><span class="price-period"> / month</span>
            </div>
            <ul class="pricing-card__features">
              <li>Unlimited Users</li>
              <li>1TB Storage</li>
              <li>24/7 Support</li>
            </ul>
            <button class="btn btn--outline">Contact</button>
          </article>
        </div>
      </div>
    </section>
  </body>
</html>
